[project]
name = "home-conditions"
version = "0.1.0"
description = "A thin building-science framework for home-monitoring apps: sample rules, a vision contract, and inspection language."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tim Rose", email = "17tr76@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
keywords = ["home", "inspection", "sensors", "building-science"]
dependencies = [
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/cheesygrin/home-conditions"
Repository = "https://github.com/cheesygrin/home-conditions"
Issues = "https://github.com/cheesygrin/home-conditions/issues"
Changelog = "https://github.com/cheesygrin/home-conditions/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_conditions"]

[tool.hatch.build.targets.sdist]
include = ["src/home_conditions", "tests", "README.md", "LICENSE", "CONTRIBUTING.md", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
